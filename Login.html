<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="Login.css">
    <title>Document</title>
</head>
<body>
    <nav>
        <div class="panel">
            <ul>
                <li class="list"><a href="#">Home</a></li>
                <li class="list"><a href="#">Services</a></li>
                <li class="list"><a href="#">About Us</a></li>
                <li class="list"><a href="#">Contact</a></li>
                <li class="bell-icon">
                    <i class="fa-solid fa-bell"><sup class="number">10</sup></i>
                </li>
            </ul>
            <h1>Login Page</h1>
        </div>
    </nav>
    <div class="container">
        <div class="close-btn">
            <i class="fa-solid fa-x"></i>
        </div>
        <div class="content">
            <div class="field">
                <input type="text" placeholder="Email Address" required>
            </div>
            <div class="field">
                <input type="password" placeholder="Password" required>
                <i class="fa-solid fa-key key"></i>
                <pre class="passkey">Password must contain 14 characters</pre>
            </div>
            <p class="password"><a href="#" class="a-tag">Forgot Password?</a></p>
        </div>
        <div class="bottom">
            <button type="button" class="btn">Login</button>
        </div>
        <p class="text">Not Registered? <a href="#" class="a-tag">Create Account</a></p>
    </div>
    <div class="foot">
        <i class="fa-brands fa-whatsapp"></i>
    </div>
</body>

</html>
