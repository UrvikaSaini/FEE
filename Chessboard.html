<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color:#d9dadb;
        }
        h1{
            text-align:center;
            margin-top:1.5rem;
            font-size: 2.2rem;
        }
        .parent-grid {
            margin:auto;
            margin-top:8rem;
            width: 400px;
            height: 400px;
            border: 2px solid black;
            box-shadow:2px 20px 25px rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
        }

        .child-grid:hover{
            transform: scale(1.05);
        }
        .black {
            background-color: black;
        }

        .white {
            background-color: white;
        }

    </style>
</head>

<body>
    <h1>Chessboard</h1>
    <div class="container">
        <div class="parent-grid">
            <div class="child-grid black"></div>
            <div class="child-grid white"></div>
            <div class="child-grid black"></div>
            <div class="child-grid white"></div>
            <div class="child-grid black"></div>
            <div class="child-grid white"></div>
